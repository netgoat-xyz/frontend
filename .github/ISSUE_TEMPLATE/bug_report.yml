name: Bug report
description: Something in the NetGoat frontend is broken or behaves unexpectedly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** include secrets, tokens or private URLs.
        For a security issue, use the private process in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behaviour, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or branch
      description: The SHA or branch you are running.
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Local dev (bun run dev)
        - Docker image
        - Self-hosted deployment
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, Node/Bun version
